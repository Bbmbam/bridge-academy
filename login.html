<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1b4332">
  <title>เข้าสู่ระบบ - Bridge Classroom</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
  <!-- โหลด Supabase JS Client ผ่าน CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .auth-container { max-width: 440px; margin: 40px auto; padding: 0 16px; }
    .auth-card { background: var(--card); border-radius: var(--radius); padding: 28px 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); border-top: 5px solid var(--primary); }
    .auth-tabs { display: flex; margin-bottom: 24px; border-bottom: 2px solid #eee; }
    .auth-tab { flex: 1; padding: 10px; text-align: center; background: none; border: none; font-family: 'Sarabun', sans-serif; font-size: 1.05rem; font-weight: bold; color: var(--muted); cursor: pointer; position: relative; }
    .auth-tab.active { color: var(--primary); }
    .auth-tab.active::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 3px; background: var(--accent); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.95rem; }
    .form-control { width: 100%; min-height: var(--tap); padding: 10px 14px; border: 1px solid #ced4da; border-radius: 8px; font-family: 'Sarabun', sans-serif; font-size: 1rem; }
    .form-control:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(82, 183, 136, 0.2); }
    .auth-btn { width: 100%; margin-top: 8px; background: var(--primary); color: #fff; }
    .auth-btn:hover { background: var(--secondary); }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--muted); }
    .auth-footer a { color: var(--secondary); font-weight: bold; text-decoration: none; }
    .alert-msg { padding: 10px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem; display: none; }
    .alert-success { background: #d8f3dc; color: var(--primary); border: 1px solid #b7e4c7; }
    .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .loading { opacity: 0.7; pointer-events: none; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">♠<span class="red">♥♦</span>♣ Bridge Classroom</a>
    <button class="menu-toggle" aria-label="เปิดเมนู" aria-expanded="false" aria-controls="navLinks">☰</button>
    <div class="nav-links" id="navLinks">
      <a href="system/index.html">ระบบประมูล</a>
      <a href="learn/counting.html">นับไพ่</a>
      <a href="practice/index.html">ฝึกประมูล</a>
      <a href="analyzer/hand.html">วิเคราะห์</a>
      <a href="login.html" class="btn-login" aria-current="page">เข้าสู่ระบบ</a>
    </div>
  </nav>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">เข้าสู่ระบบ</button>
        <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">สร้างบัญชีผู้ใช้</button>
      </div>

      <div id="alertBox" class="alert-msg"></div>

      <!-- ฟอร์มเข้าสู่ระบบ -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginUser">ชื่อผู้ใช้ (Username)</label>
          <input type="text" id="loginUser" class="form-control" placeholder="กรอกชื่อผู้ใช้ของคุณ" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">รหัสผ่าน</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" id="btnLoginSubmit" class="btn auth-btn">เข้าสู่ระบบ</button>
      </form>

      <!-- ฟอร์มสมัครสมาชิก -->
      <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
        <div class="form-group">
          <label for="regUser">ตั้งชื่อผู้ใช้ (Username)</label>
          <input type="text" id="regUser" class="form-control" placeholder="ภาษาอังกฤษหรือตัวเลข เช่น bridge_pro" required>
        </div>
        <div class="form-group">
          <label for="regPassword">ตั้งรหัสผ่าน</label>
          <input type="password" id="regPassword" class="form-control" placeholder="อย่างน้อย 4 ตัวขึ้นไป" required>
        </div>
        <button type="submit" id="btnRegSubmit" class="btn auth-btn">สร้างบัญชีและเข้าใช้งาน</button>
      </form>

      <div class="auth-footer">
        <p>ต้องการใช้งานแบบชั่วคราว? <a href="index.html">กลับหน้าแรก (Guest)</a></p>
      </div>
    </div>
  </main>

  <script>
    // ⚠️ นำ URL และ anon Key จากหน้า Project Settings > API มาใส่ที่นี่
    const SUPABASE_URL = 'https://oedgolwpnxuhsuulohyy.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_bzBvrmkMZIvV5XRU1v_jDg__lRpzlXA';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function switchTab(type) {
      let loginForm = document.getElementById('loginForm');
      let regForm = document.getElementById('registerForm');
      let tabLogin = document.getElementById('tabLogin');
      let tabReg = document.getElementById('tabRegister');
      let alertBox = document.getElementById('alertBox');
      
      alertBox.style.display = 'none';

      if(type === 'login') {
        loginForm.style.display = 'block';
        regForm.style.display = 'none';
        tabLogin.classList.add('active');
        tabReg.classList.remove('active');
      } else {
        loginForm.style.display = 'none';
        regForm.style.display = 'block';
        tabReg.classList.add('active');
        tabLogin.classList.remove('active');
      }
    }

    function showAlert(msg, type) {
      let alertBox = document.getElementById('alertBox');
      alertBox.textContent = msg;
      alertBox.className = `alert-msg ${type === 'success' ? 'alert-success' : 'alert-error'}`;
      alertBox.style.display = 'block';
    }

    // ฟังก์ชันสมัครสมาชิก (เช็กชื่อซ้ำผ่านฐานข้อมูลกลาง)
    async function handleRegister(event) {
      event.preventDefault();
      let username = document.getElementById('regUser').value.trim();
      let password = document.getElementById('regPassword').value;
      let btn = document.getElementById('btnRegSubmit');

      if (username.length < 3) {
        showAlert('ชื่อผู้ใช้ต้องมีความยาวอย่างน้อย 3 ตัวอักษร', 'error');
        return;
      }

      btn.classList.add('loading');
      btn.textContent = 'กำลังตรวจสอบข้อมูล...';

      try {
        let { data, error } = await supabaseClient
          .from('users')
          .insert([{ username: username, password: password }]);

        if (error) {
          if (error.code === '23505' || error.message.includes('duplicate') || error.message.includes('already exists')) {
            showAlert('❌ ชื่อผู้ใช้นี้ถูกใช้งานไปแล้ว กรุณาเลือกชื่ออื่น', 'error');
          } else {
            showAlert('เกิดข้อผิดพลาด: ' + error.message, 'error');
          }
          btn.classList.remove('loading');
          btn.textContent = 'สร้างบัญชีและเข้าใช้งาน';
          return;
        }

        showAlert(`✨ สร้างบัญชีสำเร็จ ยินดีต้อนรับคุณ ${username}!`, 'success');
        localStorage.setItem('bridge_user_logged', 'true');
        localStorage.setItem('bridge_user_name', username);

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1500);

      } catch (err) {
        showAlert('ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error');
        btn.classList.remove('loading');
        btn.textContent = 'สร้างบัญชีและเข้าใช้งาน';
      }
    }

    // ฟังก์ชันเข้าสู่ระบบ
    async function handleLogin(event) {
      event.preventDefault();
      let username = document.getElementById('loginUser').value.trim();
      let password = document.getElementById('loginPassword').value;
      let btn = document.getElementById('btnLoginSubmit');

      btn.classList.add('loading');
      btn.textContent = 'กำลังตรวจสอบ...';

      try {
        let { data, error } = await supabaseClient
          .from('users')
          .select('*')
          .eq('username', username)
          .eq('password', password)
          .single();

        if (error || !data) {
          showAlert('❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง', 'error');
          btn.classList.remove('loading');
          btn.textContent = 'เข้าสู่ระบบ';
          return;
        }

        showAlert(`🎉 ยินดีต้อนรับคุณ ${username} กลับมา!`, 'success');
        localStorage.setItem('bridge_user_logged', 'true');
        localStorage.setItem('bridge_user_name', username);

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1500);

      } catch (err) {
        showAlert('ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error');
        btn.classList.remove('loading');
        btn.textContent = 'เข้าสู่ระบบ';
      }
    }
  </script>
</body>
</html>
